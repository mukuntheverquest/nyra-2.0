      --color-accent:  #10b981;
      --color-amber:   #f59e0b;

    body {

      background: var(--color-paper);
      color: var(--color-ink);

      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 0.4rem;

      font-size: 0.95rem;
      color: var(--color-muted);
      margin-bottom: 1.75rem;
      max-width: 950px;
      line-height: 1.5;
    }

    svg {
      width: 100%;
      height: auto;
      display: block;
      background: var(--color-surface);
      border-radius: 16px;
